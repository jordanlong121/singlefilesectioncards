# Builds the plugin from a tag, attaches GitHub artifact attestations to the
# assets (cryptographic provenance: these files came from this source), and
# uploads them to the tag's release.
#
# Runs automatically when a version tag is pushed. Can also be dispatched
# manually against an existing tag to rebuild + attest its release assets.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, attest, and upload assets for"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Manifest version must match the tag
        run: |
          V="$(node -p "require('./manifest.json').version")"
          if [ "$V" != "${{ steps.tag.outputs.tag }}" ]; then
            echo "manifest.json says $V but the tag is ${{ steps.tag.outputs.tag }}" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
